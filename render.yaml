services:
  - type: web
    runtime: python
    name: jodala-microfinance
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python frontend/build_frontend.py"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - jodalamicrofinance.co.ke
    envVars:
      - key: DEBUG
        value: "false"
      - key: DB_PATH
        value: /var/data/sacco.db
      - key: SEED_DEMO_DATA
        value: "false"
      - key: BOOTSTRAP_ADMIN
        value: "true"
      - key: BOOTSTRAP_ADMIN_NAME
        value: Jodala Admin
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXP_HOURS
        value: "24"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_WINDOW_SECONDS
        value: "600"
      - key: LOGIN_BLOCK_SECONDS
        value: "900"
      - key: SECRET_KEY
        generateValue: true
