services:
  - type: web
    runtime: python
    name: jodala-microfinance
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - jodalamicrofinance.co.ke
    envVars:
      - key: DEBUG
        value: "false"
      - key: DB_PATH
        value: /opt/render/project/src/sacco.db
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXP_HOURS
        value: "24"
      - key: SECRET_KEY
        generateValue: true
