services:
  - type: web
    runtime: python
    name: jodala-microfinance
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c \"from database import init_db; init_db()\" && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - jodalamicrofinance.co.ke
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "false"
      - key: DB_PATH
        value: /var/data/sacco.db
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXP_HOURS
        value: "24"
      - key: SECRET_KEY
        generateValue: true
